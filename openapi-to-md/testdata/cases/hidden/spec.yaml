openapi: 3.0.3
info: {title: Hidden, version: "1"}
paths:
  /login:
    post:
      operationId: SignIn
      summary: Exchange a password for a session token
      x-mcp-hidden: true
      tags: [auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user, password]
              properties:
                user: {type: string}
                password: {type: string, format: password}
      responses: {'200': {description: ok}}
  /me:
    get:
      operationId: WhoAmI
      summary: Show the signed-in user
      tags: [auth]
      x-mcp-hidden: false
      responses: {'200': {description: ok}}
