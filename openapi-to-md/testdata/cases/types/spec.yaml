openapi: 3.0.3
info: {title: Types, version: "1"}
paths:
  /trees:
    post:
      operationId: PlantTree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [species, location]
              properties:
                species: {type: string}
                location: {$ref: '#/components/schemas/Location'}
                root: {$ref: '#/components/schemas/Node'}
                waypoints:
                  type: array
                  items: {$ref: '#/components/schemas/Location'}
                labels:
                  type: object
                  additionalProperties: {$ref: '#/components/schemas/Label'}
                care:
                  description: Care plan.
                  type: object
                  required: [interval]
                  properties:
                    interval: {type: integer, description: Days between waterings.}
                    fertilize: {type: boolean}
                    log:
                      type: object
                      properties:
                        notes: {type: string}
                        id: {type: string, readOnly: true}
                notify:
                  type: array
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/EmailTarget'
                      - $ref: '#/components/schemas/WebhookTarget'
      responses: {'200': {description: ok}}
    put:
      operationId: ReplantTree
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                location: {$ref: '#/components/schemas/Location'}
      responses: {'200': {description: ok}}
  /secret:
    post:
      operationId: SecretGarden
      x-mcp-hidden: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plot: {$ref: '#/components/schemas/HiddenPlot'}
      responses: {'200': {description: ok}}
components:
  schemas:
    Location:
      type: object
      required: [lat, lon]
      properties:
        lat: {type: number, format: double}
        lon: {type: number, format: double}
        clear:
          type: boolean
          description: If true, clear the location's history.
          x-mcp-class: destructive
    Node:
      type: object
      properties:
        name: {type: string}
        children:
          type: array
          items: {$ref: '#/components/schemas/Node'}
    Label:
      type: object
      properties:
        text: {type: string}
        color: {type: string, enum: [red, green]}
    EmailTarget:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    WebhookTarget:
      type: object
      required: [url]
      properties:
        url: {type: string, format: uri}
        secret: {type: string}
    HiddenPlot:
      type: object
      properties:
        size: {type: integer}
