openapi: 3.1.0
info: {title: ThreeOne, version: "1"}
paths:
  /items/{itemId}:
    patch:
      operationId: PatchItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: {type: [string, integer]}
        - name: note
          in: query
          schema: {type: [string, "null"]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {const: gadget}
                weight: {type: [number, "null"], format: float}
                labels: {type: [array, "null"], items: {type: string}}
                mode: {type: string, enum: [fast, slow, null]}
      responses: {'200': {description: ok}}
