openapi: 3.0.3
info: {title: Content params, version: "1"}
paths:
  /search:
    get:
      operationId: Search
      parameters:
        - name: filter
          in: query
          description: A JSON filter object.
          content:
            application/json:
              schema: {type: object, properties: {field: {type: string}, value: {type: string}}}
        - name: since
          in: query
          schema: {type: string, format: date-time, deprecated: true}
      responses: {'200': {description: ok}}
