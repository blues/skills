openapi: 3.0.3
info: {title: Headers, version: "1"}
paths:
  /docs/{docName}:
    put:
      operationId: PutDoc
      parameters:
        - {name: docName, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, description: Current ETag of the doc., schema: {type: string}}
        - {name: X-Request-ID, in: header, schema: {type: string, format: uuid}}
        - {name: Accept, in: header, schema: {type: string}}
        - {name: Content-Type, in: header, schema: {type: string}}
        - {name: Authorization, in: header, schema: {type: string}}
        - {name: session, in: cookie, schema: {type: string}}
      requestBody:
        required: true
        content:
          text/markdown:
            schema: {type: string, description: The document text.}
      responses: {'200': {description: ok}}
